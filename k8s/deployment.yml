apiVersion: apps/v1
kind: Deployment
metadata:
  name: cartdeploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cartapp
  template:
    metadata:
      labels:
        app: cartapp
    spec:
      containers:
      - name: mycart
        image: vsawantvinay/my-devsecops-img:v1
        ports:
        - containerPort: 9090
---

apiVersion: v1
kind: Service
metadata:
  name: mycartsvc
spec:
  selector:
    app: cartapp
  type: NodePort
  ports:
  - port: 80
    targetPort: 9090
    nodePort: 30412
